<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FPL Value Studio{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script defer src="/static/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">FPL <span>Value Studio</span></a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/spreadsheet">Master Spreadsheet</a>
      <a href="/my-team">My Team</a>
      <a href="/recommendation">AI Recommender</a>
      <a href="/differentials">Differentials</a>
      <a href="/transfer-market">Transfer Market</a>
      <a href="/templates">Templates</a>
    </nav>
    <a class="settings-link" href="/settings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Zm9 3.75c0-.56-.05-1.1-.15-1.63l-2.03-.78a7 7 0 0 0-.77-1.34l.88-1.99a9.8 9.8 0 0 0-2.3-2.3l-1.99.88a7 7 0 0 0-1.34-.77l-.78-2.03a9.8 9.8 0 0 0-3.26 0l-.78 2.03a7 7 0 0 0-1.34.77l-1.99-.88a9.8 9.8 0 0 0-2.3 2.3l.88 1.99a7 7 0 0 0-.77 1.34l-2.03.78a9.8 9.8 0 0 0 0 3.26l2.03.78c.2.48.46.93.77 1.34l-.88 1.99a9.8 9.8 0 0 0 2.3 2.3l1.99-.88c.41.31.86.57 1.34.77l.78 2.03a9.8 9.8 0 0 0 3.26 0l.78-2.03a7 7 0 0 0 1.34-.77l1.99.88a9.8 9.8 0 0 0 2.3-2.3l-.88-1.99c.31-.41.57-.86.77-1.34l2.03-.78c.1-.53.15-1.07.15-1.63Z"/></svg>
    </a>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
      <button class="ghost small" type="submit">Log out</button>
    </form>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer>
    FPL Value Studio · Independent analytics using public FPL data
  </footer>
</body>
</html>
