name: Production Health

on:
  pull_request:
    branches: [feat/railway-fpl-value-studio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fpl:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://web-production-f5979.up.railway.app/health' || true)" = '200'

  select-xi:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://select-xi.pro/' || true)" = '200'

  soccer-scanner:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://soccerscanner.pro/' || true)" = '200'

  game-theory-atlas:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://web-production-d47ea.up.railway.app/' || true)" = '200'

  portfolio:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://leifheaney.com/' || true)" = '200'

  optio:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Optio public login
        run: |
          code=$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://optio.news/login' || true)
          echo "Optio /login -> HTTP $code"
          test "$code" = '200'
