name: Production Health

on:
  pull_request:
    branches: [feat/railway-fpl-value-studio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regula:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Regula frontend and API health
        run: |
          set -euo pipefail
          for path in / /api/health; do
            code=$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 "https://regula-production.up.railway.app${path}" || true)
            echo "$path -> HTTP $code"
            test "$code" = '200'
          done
