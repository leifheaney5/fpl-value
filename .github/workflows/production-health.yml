name: Production Health

on:
  pull_request:
    branches: [feat/railway-fpl-value-studio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regula:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Regula frontend and API health
        run: |
          set -u
          for path in / /api/health; do
            echo "===== $path ====="
            curl -L -sS -D - -o /tmp/body --max-time 30 "https://regula-production.up.railway.app${path}" || true
            echo "--- body ---"
            head -c 1000 /tmp/body || true
            echo
          done
