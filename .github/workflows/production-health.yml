name: Production Health

on:
  pull_request:
    branches: [feat/railway-fpl-value-studio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fpl:
    runs-on: ubuntu-latest
    steps:
      - name: FPL Value
        run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://web-production-f5979.up.railway.app/health' || true)" = '200'

  tickertracker:
    runs-on: ubuntu-latest
    steps:
      - name: TickerTracker
        run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://tickertracker.info/' || true)" = '200'

  newleaf:
    runs-on: ubuntu-latest
    steps:
      - name: New Leaf liveness and readiness
        run: |
          set -euo pipefail
          for path in /api/health /api/ready; do
            code=$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 "https://web-production-31a38.up.railway.app${path}" || true)
            echo "$path -> HTTP $code"
            test "$code" = '200'
          done

  trodden-web:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://web-production-58073b.up.railway.app/' || true)" = '200'

  trodden-api:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://api-production-421a.up.railway.app/healthz' || true)" = '200'

  trodden-tiles:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://tileserver-production-bfec.up.railway.app/catalog' || true)" = '200'

  hawkeye:
    runs-on: ubuntu-latest
    steps:
      - name: Hawkeye frontend and API
        run: |
          set -euo pipefail
          for path in / /api/health; do
            code=$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 "https://hawkeyetech.info${path}" || true)
            echo "$path -> HTTP $code"
            test "$code" = '200'
          done
