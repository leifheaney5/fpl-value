services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fpl
      POSTGRES_USER: fpl
      POSTGRES_PASSWORD: fpl
    ports:
      - "5432:5432"
    volumes:
      - fpl_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpl -d fpl"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    command: bash scripts/start-web.sh
    environment:
      DATABASE_URL: postgresql+psycopg://fpl:fpl@db:5432/fpl
      SESSION_SECRET: local-development-secret
      APP_USERNAME: admin
      APP_PASSWORD: admin
      APP_TIMEZONE: America/New_York
      REFRESH_HOUR: 10
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fpl_postgres:
